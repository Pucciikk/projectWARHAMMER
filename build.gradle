plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

loom {
    // Клиентский код живёт отдельно: сервер его никогда не загрузит
    splitEnvironmentSourceSets()

    mods {
        warpbound {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // ./gradlew runGametest — автотесты без игрока (сервер сам запускает тесты и выходит)
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
            runDir "build/gametest"
        }
        // ./gradlew runAutotest -Pscenario=<имя> — клиент сам открывает тестовый мир, выполняет
        // run/autotest/<имя>.txt (команды, взгляд, скриншоты) и закрывается
        autotest {
            client()
            name "Autotest"
            vmArg "-Dwarpbound.autotest=${project.findProperty('scenario') ?: 'smoke'}"
            vmArg "-Dwarpbound.autotest.dir=${project.file('tools/autotest').absolutePath}"
            runDir "run"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Имена Mojang + параметры и javadoc из Parchment
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Анимированные модели сущностей и блоков (формат Blockbench «GeckoLib Animated Model»)
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
